services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ats-backend-server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      # Note: If MONGODB_URI is left unset, the server smoothly boots in deterministic offline simulation mode
    networks:
      - ats-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:4000
    container_name: ats-frontend-client
    ports:
      - "8000:80"
    depends_on:
      - server
    networks:
      - ats-network
    restart: unless-stopped

networks:
  ats-network:
    driver: bridge
    name: ats_isolated_network
