server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression for optimal static asset loading performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve React single-page application with HTML5 history API router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API requests cleanly to the Docker Compose backend network service
    location /resume/ {
        proxy_pass http://server:4000/resume/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
